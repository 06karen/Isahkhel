<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Icha Khel — WebXR Prototype (A-Frame)</title>

    <!-- A-Frame core + teleport-controls extra, both from CDN so this stays a single file -->
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://unpkg.com/aframe-extras@7.2.0/dist/aframe-extras.min.js"></script>

    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
            background: #060811;
        }

        /* ---- 2D overlay UI (hidden automatically once an XR session starts) ---- */
        #hud {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 10;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            padding: 16px 20px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            color: #e6e6f0;
            pointer-events: none;
        }

        #hud .brand {
            font-size: 15px;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            opacity: 0.85;
        }

        #status {
            background: rgba(10, 10, 20, 0.55);
            backdrop-filter: blur(6px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 10px;
            padding: 10px 14px;
            font-size: 13px;
            line-height: 1.5;
            max-width: 280px;
            pointer-events: none;
        }

        #status b {
            color: #9fd5ff;
        }

        #enter-vr-hint {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            background: rgba(10, 10, 20, 0.65);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 999px;
            padding: 10px 18px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            color: #d8d8e6;
            font-size: 13px;
            pointer-events: none;
        }

        /* Comfort vignette shown briefly during teleport/turn, reduces motion sickness */
        #comfort-vignette {
            position: fixed;
            inset: 0;
            z-index: 5;
            pointer-events: none;
            background: radial-gradient(circle, rgba(0, 0, 0, 0) 45%, rgba(5, 5, 10, 0.9) 100%);
            opacity: 0;
            transition: opacity 0.15s ease;
        }

        #comfort-vignette.active {
            opacity: 1;
        }

        a-scene {
            width: 100%;
            height: 100%;
        }
    </style>
</head>

<body>

    <div id="hud">
        <div class="brand">Icha Khel</div>
        <div id="status">
            <div><b>Controllers:</b> <span id="ctrl-status">searching…</span></div>
            <div><b>Locomotion:</b> right thumbstick teleport, trigger to grab</div>
        </div>
    </div>

    <div id="enter-vr-hint">Put on your headset and click "Enter VR" (bottom right) — built for Meta Quest 3S</div>
    <div id="comfort-vignette"></div>

    <a-scene background="color: #0b0d16" fog="type: exponential; color: #0b0d16; density: 0.015"
        renderer="colorManagement: true; physicallyCorrectLights: true; antialias: true"
        vr-mode-ui="enterVRButton: #enter-vr-btn">

        <a-assets>
            <!-- Soft gradient sky texture, generated procedurally so no external image is needed -->
            <canvas id="sky-canvas" width="2" height="512"></canvas>
        </a-assets>

        <!-- ============================================================ -->
        <!--  Environment: soft dreamy sky, ground, ambient + directional  -->
        <!-- ============================================================ -->
        <a-sky id="sky" radius="200" src="#sky-canvas"></a-sky>

        <a-light type="ambient" color="#4a4560" intensity="0.9"></a-light>
        <a-light type="directional" color="#ffe3c2" intensity="0.55" position="-3 6 -2"
            light="castShadow: true"></a-light>
        <a-light type="hemisphere" color="#8fa8ff" ground-color="#2a2035" intensity="0.6"></a-light>

        <a-plane id="ground" rotation="-90 0 0" width="60" height="60" color="#232838"
            material="roughness: 0.95; metalness: 0.05" shadow="receive: true" class="teleport-ground">
        </a-plane>

        <!-- soft grid overlay for spatial legibility -->
        <a-entity geometry="primitive: plane; width: 60; height: 60" rotation="-90 0 0" position="0 0.01 0"
            material="shader: flat; src: ; color: #3a4160; wireframe: true; wireframeLinewidth: 1; opacity: 0.25; transparent: true">
        </a-entity>

        <!-- ============================================================ -->
        <!--  Placeholder "Adaptive Athletic Park" world objects            -->
        <!-- ============================================================ -->
        <a-entity id="world-objects">
            <a-sphere position="-3 1.2 -6" radius="0.9" color="#ff8c69" material="roughness: 0.4; metalness: 0.1"
                shadow="cast: true"
                animation="property: position; dir: alternate; dur: 3000; easing: easeInOutSine; to: -3 1.7 -6; loop: true">
            </a-sphere>

            <a-box position="3 0.75 -7" width="1.5" height="1.5" depth="1.5" color="#7cc4ff" material="roughness: 0.5"
                shadow="cast: true" animation="property: rotation; dur: 12000; easing: linear; to: 0 360 0; loop: true"
                class="grabbable">
            </a-box>

            <a-cylinder position="0 1 -10" radius="0.6" height="2" color="#b98cff" material="roughness: 0.4"
                shadow="cast: true">
            </a-cylinder>

            <a-torus position="-6 1.5 -4" radius="0.8" radius-tubular="0.12" color="#ffe08c" shadow="cast: true"
                animation="property: rotation; dir: alternate; dur: 4000; to: 45 180 0; loop: true">
            </a-torus>

            <!-- simple raised platform, doubles as a teleport-target demo -->
            <a-box position="6 0.25 -3" width="3" height="0.5" depth="3" color="#2f3550" class="teleport-ground"
                shadow="receive: true">
            </a-box>
        </a-entity>

        <!-- ============================================================ -->
        <!--  Player rig: camera + two Meta Quest 3S controllers           -->
        <!-- ============================================================ -->
        <a-entity id="rig" position="0 0 2" movement-controls="fly: false; speed: 0.12"
            teleport-controls="cameraRig: #rig; teleportOrigin: #camera; button: trackpad; collisionEntities: .teleport-ground; type: parabolic; curveShootingSpeed: 6; landingMaxAngle: 45">
            <a-entity id="camera" camera position="0 1.6 0" look-controls="pointerLockEnabled: true"
                wasd-controls="acceleration: 40">
            </a-entity>

            <!-- Left controller: Meta Quest 3S left touch controller.
         oculus-touch-controls auto-maps to Quest hardware; hand="left"
         selects the correct model/offset. Laser + teleport-controls
         both attach here so the left stick/trigger can also steer. -->
            <a-entity id="left-hand" oculus-touch-controls="hand: left; model: true" laser-controls="hand: left"
                teleport-controls="cameraRig: #rig; teleportOrigin: #camera; button: thumbstick; collisionEntities: .teleport-ground; curveShootingSpeed: 6"
                raycaster="objects: .grabbable; far: 10" line="color: #7cc4ff; opacity: 0.6">
            </a-entity>

            <!-- Right controller: primary teleport + interaction hand -->
            <a-entity id="right-hand" oculus-touch-controls="hand: right; model: true" laser-controls="hand: right"
                teleport-controls="cameraRig: #rig; teleportOrigin: #camera; button: thumbstick; collisionEntities: .teleport-ground; curveShootingSpeed: 6"
                raycaster="objects: .grabbable; far: 10" line="color: #ffb37c; opacity: 0.6">
            </a-entity>
        </a-entity>

    </a-scene>

    <script>
        // -------------------------------------------------------------
        // Procedural sky gradient — dreamy dusk tone, no external asset
        // -------------------------------------------------------------
        (function paintSky() {
            const canvas = document.getElementById('sky-canvas');
            const ctx = canvas.getContext('2d');
            const grad = ctx.createLinearGradient(0, 0, 0, canvas.height);
            grad.addColorStop(0, '#1b1636');
            grad.addColorStop(0.45, '#4a3563');
            grad.addColorStop(0.75, '#8a6a8f');
            grad.addColorStop(1, '#d9a883');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, canvas.width, canvas.height);
        })();

        const sceneEl = document.querySelector('a-scene');
        const statusEl = document.getElementById('ctrl-status');
        const hud = document.getElementById('hud');
        const vrHint = document.getElementById('enter-vr-hint');
        const vignette = document.getElementById('comfort-vignette');

        let controllersConnected = 0;

        function updateStatus() {
            statusEl.textContent = controllersConnected === 2
                ? 'both connected'
                : controllersConnected === 1
                    ? '1 connected, searching…'
                    : 'searching…';
        }

        ['left-hand', 'right-hand'].forEach((id) => {
            const el = document.getElementById(id);

            el.addEventListener('controllerconnected', () => {
                controllersConnected = Math.min(2, controllersConnected + 1);
                updateStatus();
            });

            el.addEventListener('controllerdisconnected', () => {
                controllersConnected = Math.max(0, controllersConnected - 1);
                updateStatus();
            });

            // ---- Meta Quest 3S button bindings ----
            // Trigger: primary select (grab / activate a .grabbable object)
            el.addEventListener('triggerdown', () => {
                const intersected = el.components.raycaster && el.components.raycaster.intersectedEls[0];
                if (intersected) {
                    intersected.setAttribute('animation__pulse',
                        'property: scale; from: 1 1 1; to: 1.15 1.15 1.15; dur: 120; dir: alternate; loop: 2');
                }
            });

            // Grip: reserved for future "grab and carry" mechanic
            el.addEventListener('gripdown', () => {
                el.setAttribute('line', 'color', '#ffffff');
            });
            el.addEventListener('gripup', () => {
                el.setAttribute('line', 'color', id === 'left-hand' ? '#7cc4ff' : '#ffb37c');
            });

            // A/X button (or B/Y on right/left) — quick "recenter" style action stub
            el.addEventListener('abuttondown', () => flashVignette());
            el.addEventListener('xbuttondown', () => flashVignette());

            // Thumbstick-driven teleport already handled by teleport-controls;
            // show the comfort vignette while a teleport is in flight.
            el.addEventListener('teleported', () => flashVignette());
        });

        function flashVignette() {
            vignette.classList.add('active');
            setTimeout(() => vignette.classList.remove('active'), 250);
        }

        updateStatus();

        // Hide the 2D HUD once inside the headset, restore it on exit
        sceneEl.addEventListener('enter-vr', () => {
            hud.style.display = 'none';
            vrHint.style.display = 'none';
        });
        sceneEl.addEventListener('exit-vr', () => {
            hud.style.display = 'flex';
            vrHint.style.display = 'block';
        });
    </script>

</body>

</html>
